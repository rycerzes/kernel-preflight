# Shipped sandbox catalog: provider presets offered by
# GET /api/v1/catalog/sandbox-providers for the UI to copy into
# PUT /api/v1/settings/sandbox-providers bodies. Discovery-only — never executed against.
providers:
  - type: daytona
    exec_timeout_ms: 60000
    auto_stop_interval_in_minutes: 5
    auto_archive_interval_in_minutes: 60
    auto_delete_interval_in_minutes: 7200
  - type: docker
    # The stock CUDA devel image has nvcc but no Python, and the sandbox
    # bootstrap needs python3 plus pydantic to materialise git-backed skills --
    # without them initialisation fails with "python3: not found". Build this
    # image from docker/Dockerfile.sandbox before selecting the preset.
    image: kernel-preflight-sandbox:cuda13
    exec_timeout_ms: 600000
    gpus: all
